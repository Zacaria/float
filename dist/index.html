<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' tauri: asset: file: data: blob: filesystem:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; connect-src 'self' ipc:">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Float</title>
    <style>
      html, body { height: 100%; margin: 0; font-family: -apple-system, system-ui, Segoe UI, Roboto, Arial, sans-serif; background: #111; color: #ccc; }
      [data-tauri-drag-region] { -webkit-app-region: drag; }
      .no-drag { -webkit-app-region: no-drag; }
      #app { height: 100%; width: 100%; position: relative; }
      .image-container { height: 100%; width: 100%; display: grid; place-items: center; background: #111; }
      .image-container img { max-width: 100%; max-height: 100%; object-fit: contain; display: none; user-select: none; -webkit-user-drag: none; }
      .image-container.placeholder img { display: none; }
      .image-container:not(.placeholder) img { display: block; }
      .image-container:not(.placeholder) .placeholder-text { display: none; }
      .placeholder-text { color: #888; font-size: 14px; text-align: center; padding: 12px; }
      .hud { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; pointer-events: none; }
      .hud .info { background: rgba(0,0,0,0.55); padding: 6px 10px; border-radius: 8px; font-size: 13px; color: #eee; max-width: 70%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .controls { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; transition: opacity 0.2s ease; }
      .btn { pointer-events: auto; background: rgba(255,255,255,0.08); color: #eee; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; padding: 8px 12px; font-size: 13px; cursor: pointer; }
      .btn:disabled { opacity: 0.4; cursor: not-allowed; }
      .hud,
      .controls { opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
      .chrome-visible .hud,
      .chrome-visible .controls { opacity: 1; pointer-events: auto; }
      .hud { pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app" class="chrome-visible" data-tauri-drag-region>
      <div class="hud">
        <div class="info" id="fileInfo">No file selected</div>
        <div class="info" id="status"></div>
      </div>
      <div id="imageContainer" class="image-container placeholder" data-tauri-drag-region>
        <img id="image" alt="Selected file preview" draggable="false" data-tauri-drag-region />
        <div id="placeholder" class="placeholder-text" data-tauri-drag-region>No file selected</div>
      </div>
      <div class="controls no-drag">
        <button id="prevBtn" class="btn no-drag" type="button">Previous</button>
        <button id="nextBtn" class="btn no-drag" type="button">Next</button>
        <button id="slideshowBtn" class="btn no-drag" type="button">Slideshow: Off</button>
        <select id="slideshowInterval" class="btn no-drag" aria-label="Slideshow interval">
          <option value="2000">2s</option>
          <option value="5000" selected>5s</option>
          <option value="10000">10s</option>
          <option value="15000">15s</option>
        </select>
      </div>
    </div>
    <script>
      const tauri = window.__TAURI__ || {};
      const invoke = (cmd, args) => {
        if (tauri?.core?.invoke) return tauri.core.invoke(cmd, args); // Tauri v2 global API
        if (tauri.invoke) return tauri.invoke(cmd, args); // fallback for older globals
        return Promise.resolve();
      };
      const convertFileSrc = tauri?.core?.convertFileSrc || tauri.convertFileSrc;
      const imageContainer = document.getElementById('imageContainer');
      const imageEl = document.getElementById('image');
      const placeholderEl = document.getElementById('placeholder');
      const fileInfoEl = document.getElementById('fileInfo');
      const statusEl = document.getElementById('status');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const slideshowBtn = document.getElementById('slideshowBtn');
      const slideshowIntervalEl = document.getElementById('slideshowInterval');
      const appEl = document.getElementById('app');

      const slideshowState = {
        enabled: false,
        intervalMs: 5000,
        total: 0,
      };
      let slideshowTimer = null;

      const defaultPlaceholder = () => {
        const platform =
          navigator?.userAgentData?.platform ||
          navigator?.platform ||
          '';
        const isMac = platform.toUpperCase().includes('MAC');
        const shortcut = isMac ? '⌘+O' : 'Ctrl+O';
        return `No file selected — press ${shortcut} to open`;
      };

      const showPlaceholder = (message = defaultPlaceholder()) => {
        imageContainer.classList.add('placeholder');
        placeholderEl.textContent = message;
        imageEl.src = '';
        fileInfoEl.textContent = message;
        statusEl.textContent = '';
        prevBtn.disabled = true;
        nextBtn.disabled = true;
        slideshowState.total = 0;
        syncSlideshowUi();
        stopSlideshow();
      };

      const stopSlideshow = () => {
        if (slideshowTimer) {
          clearInterval(slideshowTimer);
          slideshowTimer = null;
        }
      };

      const syncSlideshowUi = () => {
        if (!slideshowBtn || !slideshowIntervalEl) return;
        slideshowBtn.textContent = `Slideshow: ${slideshowState.enabled ? 'On' : 'Off'}`;
        slideshowIntervalEl.value = String(slideshowState.intervalMs);
        const disabled = slideshowState.total <= 1;
        slideshowBtn.disabled = disabled;
        slideshowIntervalEl.disabled = disabled;
      };

      const startSlideshowIfNeeded = () => {
        stopSlideshow();
        if (!slideshowState.enabled || slideshowState.total <= 1) return;
        const interval = Number(slideshowState.intervalMs) || 5000;
        slideshowTimer = setInterval(() => {
          invoke('next_file');
        }, interval);
      };

      const persistSettings = async (update) => {
        try {
          await invoke('set_settings', { update });
        } catch (err) {
          console.warn('Failed to persist settings', err);
        }
      };

      const buildSources = (path) => {
        const sources = [];
        if (!path) return sources;
        if (convertFileSrc) {
          try {
            sources.push(convertFileSrc(path));
          } catch (_) {
            // Ignore and continue to file:// fallback
          }
        }
        const encodedPath = encodeURI(path.startsWith('/') ? path : `/${path}`);
        const fileSrc = path.startsWith('file://') ? path : `file://${encodedPath}`;
        sources.push(fileSrc);
        return sources;
      };

      const trySource = (src) =>
        new Promise((resolve) => {
          const cleanup = () => {
            imageEl.onload = null;
            imageEl.onerror = null;
          };
          imageEl.onload = () => {
            cleanup();
            imageContainer.classList.remove('placeholder');
            placeholderEl.textContent = '';
            resolve(true);
          };
          imageEl.onerror = () => {
            cleanup();
            resolve(false);
          };
          imageEl.src = src;
        });

      const showImage = async (path) => {
        if (!path) {
          showPlaceholder();
          return;
        }
        const sources = buildSources(path);
        for (let i = 0; i < sources.length; i += 1) {
          // eslint-disable-next-line no-await-in-loop
          const ok = await trySource(sources[i]);
          if (ok) return;
        }
        try {
          const dataUrl = await invoke('load_image_data', { path });
          const ok = await trySource(dataUrl);
          if (ok) return;
        } catch (err) {
          console.warn('Image fallback failed', err);
        }
        showPlaceholder('Image unavailable');
      };

      const renderState = (payload) => {
        const path = payload?.path;
        const index = payload?.index ?? null;
        const total = payload?.total ?? null;
        if (!path) {
          showPlaceholder();
          return;
        }
        const fileName = path.split(/[\\/]/).pop() || path;
        fileInfoEl.textContent = fileName;
        if (typeof index === 'number' && typeof total === 'number' && total > 0) {
          statusEl.textContent = `File ${index + 1} of ${total}`;
          prevBtn.disabled = index <= 0;
          nextBtn.disabled = index >= total - 1;
          slideshowState.total = total;
        } else {
          statusEl.textContent = '';
          prevBtn.disabled = false;
          nextBtn.disabled = false;
          slideshowState.total = 0;
        }
        syncSlideshowUi();
        startSlideshowIfNeeded();
        showImage(path);
      };

      let hideChromeTimer = null;
      const showChrome = () => {
        appEl?.classList.add('chrome-visible');
        if (hideChromeTimer) {
          clearTimeout(hideChromeTimer);
        }
        hideChromeTimer = setTimeout(() => {
          appEl?.classList.remove('chrome-visible');
        }, 2000);
      };

      const attachChromeHandlers = () => {
        ['mousemove', 'mousedown', 'keydown'].forEach((evt) => {
          window.addEventListener(evt, showChrome, { passive: true });
        });
        showChrome();
      };

      const bootstrap = async () => {
        try {
          const settings = await invoke('get_settings');
          if (typeof settings?.slideshow_enabled === 'boolean') {
            slideshowState.enabled = settings.slideshow_enabled;
          }
          if (typeof settings?.slideshow_interval_ms === 'number') {
            slideshowState.intervalMs = settings.slideshow_interval_ms;
          }
          syncSlideshowUi();
          if (settings?.last_file) {
            renderState({ path: settings.last_file });
            return;
          }
        } catch (err) {
          console.warn('Failed to load settings', err);
        }
        showPlaceholder();
      };

      bootstrap();
      attachChromeHandlers();

      const registerListeners = () => {
        if (tauri?.event?.listen) {
          tauri.event
            .listen('active-file-changed', async (event) => {
              renderState(event?.payload);
            })
            .catch((err) => console.warn('Failed to register active-file listener', err));
          tauri.event
            .listen('file-selected', async (event) => {
              // Backward compatibility fallback
              const payload = event?.payload;
              if (payload?.path || typeof payload === 'string') {
                renderState({ path: payload.path || payload });
              }
            })
            .catch((err) => console.warn('Failed to register file-selected listener', err));
        } else {
          console.warn('Tauri event API unavailable; UI will not live-update on selection.');
        }
      };

      registerListeners();

      prevBtn.addEventListener('click', () => {
        showChrome();
        invoke('previous_file');
      });
      nextBtn.addEventListener('click', () => {
        showChrome();
        invoke('next_file');
      });
      slideshowBtn?.addEventListener('click', async () => {
        showChrome();
        slideshowState.enabled = !slideshowState.enabled;
        syncSlideshowUi();
        startSlideshowIfNeeded();
        await persistSettings({ slideshow_enabled: slideshowState.enabled });
      });
      slideshowIntervalEl?.addEventListener('change', async () => {
        showChrome();
        const next = Number(slideshowIntervalEl.value);
        if (!Number.isFinite(next) || next < 1000) return;
        slideshowState.intervalMs = next;
        syncSlideshowUi();
        startSlideshowIfNeeded();
        await persistSettings({ slideshow_interval_ms: next });
      });
    </script>
  </body>
</html>
