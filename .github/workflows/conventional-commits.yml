name: conventional-commits

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select commit range
        id: range
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "value=${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          if [[ "$before" == "0000000000000000000000000000000000000000" ]]; then
            echo "value=${GITHUB_SHA}^!" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "value=${before}..${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Validate Conventional Commits
        run: ./scripts/check-conventional-commits.sh "${{ steps.range.outputs.value }}"
