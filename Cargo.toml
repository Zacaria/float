[package]
name = "float"
version = "0.2.0"
edition = "2021"
description = "Keep reference images visible above your workspace."
authors = ["Zacaria Chtatar"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Zacaria/float"
homepage = "https://zacaria.github.io/float/"

[dependencies]
# Windowing/event loop for macOS GUI
winit = "0.28"

# macOS Cocoa bindings for menubar and actions
cocoa = "0.25"
objc = "0.2"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"

[package.metadata.bundle]
name = "Float"
identifier = "com.havesomecode.float"
icon = []
resources = []
category = "public.app-category.utilities"
short_description = "Keep a window always on top."
osx_minimum_system_version = "10.13"
