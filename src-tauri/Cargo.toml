[package]
name = "float-tauri"
version = "0.2.0"
description = "Keep reference images visible above your workspace."
authors = ["Zacaria Chtatar"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Zacaria/float"
homepage = "https://zacaria.github.io/float/"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
thiserror = "1"
parking_lot = "0.12"
tauri-plugin-dialog = "2"
base64 = "0.21"
tokio = { version = "1", features = ["time"] }
directories = "5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", features = ["objc2-core-foundation"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
